name: Check Protobuf Updates

on:
  schedule:
    # Run every Monday at 9am UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: # Allow manual trigger

jobs:
  check-protobuf-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Get current protobuf version
        id: current
        run: |
          VERSION=$(git -C protobufs describe --tags --always 2>/dev/null || echo "unknown")
          # Strip leading 'v' if present for consistent comparison
          VERSION_CLEAN="${VERSION#v}"
          echo "version=$VERSION_CLEAN" >> $GITHUB_OUTPUT
          echo "Current protobuf version: $VERSION_CLEAN"

      - name: Get latest Meshtastic protobuf version
        id: latest
        run: |
          LATEST=$(curl -s https://api.github.com/repos/meshtastic/protobufs/releases/latest | jq -r .tag_name)
          # Strip leading 'v' if present
          LATEST_CLEAN="${LATEST#v}"
          echo "version=$LATEST_CLEAN" >> $GITHUB_OUTPUT
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest protobuf version: $LATEST_CLEAN"

      - name: Compare versions
        id: compare
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          # Current may be "2.7.21-6-ge30092e" (commits ahead of tag), extract base tag
          CURRENT_TAG=$(echo "$CURRENT_VERSION" | sed 's/-.*//')

          if [ "$CURRENT_TAG" = "$LATEST_VERSION" ] || [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Protobufs are up to date (current: $CURRENT_VERSION, latest: $LATEST_VERSION)"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Protobuf update available: $CURRENT_VERSION → $LATEST_VERSION"
          fi

      - name: Check for existing issue
        id: existing
        if: steps.compare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
        run: |
          EXISTING=$(gh issue list --label "protobuf-update" --state open --json number,title --jq ".[] | select(.title | contains(\"$LATEST_VERSION\")) | .number")

          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Issue #$EXISTING already exists for version $LATEST_VERSION"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue for update
        if: steps.compare.outputs.needs_update == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          # Create label if it doesn't exist
          gh label create "protobuf-update" --description "Protobuf version update available" --color "0366d6" 2>/dev/null || true

          cat << EOF > /tmp/issue_body.md
          ## Protobuf Update Available

          A new version of Meshtastic protobufs has been released.

          | | Version |
          |---|---|
          | **Current** | \`$CURRENT_VERSION\` |
          | **Latest** | \`$LATEST_VERSION\` |

          ### Update Instructions

          Run the existing update workflow manually:

          1. Go to **Actions** → **Update protobufs and regenerate classes**
          2. Click **Run workflow** on the \`develop\` branch

          Or update locally:

          \`\`\`bash
          git submodule update --remote protobufs
          ./bin/regen-protos.sh
          \`\`\`

          ### Release Notes

          View the release notes at:
          https://github.com/meshtastic/protobufs/releases/tag/$LATEST_TAG

          ### Checklist

          - [ ] Update protobufs submodule to latest release
          - [ ] Regenerate protobuf classes with \`./bin/regen-protos.sh\`
          - [ ] Review generated C++ code changes in \`src/mesh/\`
          - [ ] Build firmware and verify compilation succeeds
          - [ ] Test with a physical Meshtastic device if protobuf schema changed
          - [ ] Update any firmware code affected by protobuf changes

          ---
          *This issue was automatically created by the protobuf update checker.*
          EOF

          gh issue create \
            --title "Update Meshtastic Protobufs to $LATEST_VERSION" \
            --label "protobuf-update,enhancement" \
            --body-file /tmp/issue_body.md

      - name: Summary
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}
          NEEDS_UPDATE: ${{ steps.compare.outputs.needs_update }}
        run: |
          echo "## Protobuf Version Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Version |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Current | \`$CURRENT_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest | \`$LATEST_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$NEEDS_UPDATE" = "true" ]; then
            echo "**Update available!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Up to date**" >> $GITHUB_STEP_SUMMARY
          fi
